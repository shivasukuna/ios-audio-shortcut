# Render Blueprint Specification
# https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: ios-audio-downloader
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: API_TOKEN
        generateValue: true
      - key: OUTPUT_DIR
        value: /var/data/output
      - key: TEMP_DIR
        value: /tmp/audio-downloader
      - key: DB_PATH
        value: /var/data/db/jobs.db
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_REQUESTS
        value: "30"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: MAX_FILE_SIZE_MB
        value: "100"
      - key: MAX_DURATION_SECONDS
        value: "1800"
    disk:
      name: audio-data
      mountPath: /var/data
      sizeGB: 1
