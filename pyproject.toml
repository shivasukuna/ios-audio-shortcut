[project]
name = "audio-downloader"
version = "0.1.0"
description = "Self-hosted audio downloader backend for iOS Shortcuts"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi[standard]>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "yt-dlp>=2024.12.0",
    "pydantic>=2.10.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "aiosqlite>=0.20.0,<0.21",
    "python-multipart>=0.0.18,<0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require network access and real downloads (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
